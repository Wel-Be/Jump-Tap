<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="タップしてコイン獲得風の音を楽しむ、レトロなミニWebアプリ。">
  <title>Jump&Tap</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <script data-goatcounter="https://wel-be.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <main class="app" aria-label="Jump and Tap">
    <header class="top">
      <span class="brand">JUMP<span class="amp">&amp;</span>TAP</span>
      <span class="pixel-label">8-BIT SOUND</span>
    </header>

    <section class="play-area" aria-label="ゲームエリア">
      <button class="question-block" id="questionBlock" type="button" aria-label="ハテナブロックをタップして音を鳴らす">
        <svg class="block-art" viewBox="0 0 160 160" aria-hidden="true" focusable="false">
          <!-- pixel-style gold question block -->
          <rect x="12" y="12" width="136" height="136" fill="#71330e"/>
          <rect x="8" y="8" width="136" height="136" fill="#f4a51c"/>
          <rect x="8" y="8" width="136" height="12" fill="#ffdc55"/>
          <rect x="8" y="20" width="12" height="112" fill="#ffdc55"/>
          <rect x="20" y="20" width="112" height="112" fill="#f9bd2c"/>
          <rect x="20" y="20" width="112" height="12" fill="#ffd84b"/>
          <rect x="20" y="32" width="12" height="88" fill="#ffd84b"/>
          <rect x="120" y="32" width="12" height="88" fill="#bd5c12"/>
          <rect x="32" y="120" width="88" height="12" fill="#bd5c12"/>
          <rect x="32" y="32" width="88" height="12" fill="#ffcf3f"/>
          <path d="M54 52h40v10H54z M94 62h10v20H94z M74 82h20v10H74z M64 92h10v20H64z M64 112h12v10H64z" fill="#6d330e"/>
          <path d="M54 48h40v10H54z M94 58h10v20H94z M74 78h20v10H74z M64 88h10v20H64z M64 108h12v10H64z" fill="#fff0a0"/>
          <rect x="52" y="48" width="42" height="10" fill="#fff0a0"/>
          <rect x="92" y="58" width="12" height="20" fill="#fff0a0"/>
          <rect x="72" y="78" width="22" height="10" fill="#fff0a0"/>
          <rect x="62" y="88" width="12" height="20" fill="#fff0a0"/>
          <rect x="62" y="108" width="14" height="10" fill="#fff0a0"/>
          <rect x="62" y="126" width="14" height="6" fill="#71330e"/>
          <rect x="8" y="132" width="136" height="12" fill="#a64b10"/>
          <rect x="132" y="8" width="12" height="136" fill="#a64b10"/>
        </svg>
      </button>
      <p class="hint" id="hint" aria-live="polite">TAP TO GET COIN</p>
    </section>

    <section class="volume-panel" aria-label="音量設定">
      <div class="volume-heading">
        <label for="volume">SOUND VOLUME</label>
        <output id="volumeValue" for="volume">30%</output>
      </div>
      <input id="volume" type="range" min="0" max="100" value="30" step="1" aria-label="効果音の音量">
      <div class="volume-ends"><span>QUIET</span><span>LOUD</span></div>
    </section>

    <footer class="footer">
      <span class="maker">Wel (Be)</span>
      <a href="https://ofuse.me/f3a8ad6a" target="_blank" rel="noopener noreferrer">改善のアイディア・応援はこちら ↗</a>
    </footer>
    <p class="audio-error" id="audioError" role="status" hidden>音を再生できませんでした。画面をもう一度タップしてお試しください。</p>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
